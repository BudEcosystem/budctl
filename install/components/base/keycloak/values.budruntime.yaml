ingress:
  enabled: true
  https: true
  host: auth.bud.lan

image: registry.bud.studio/runtime/keycloak-budtheme:0.2.5
imagePullSecrets:
  - name: registry.bud.studio

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 75
        preference:
          matchExpressions:
            - key: bud.studio/control-plane
              operator: In
              values:
                - "true"

realms:
  keycloak-bud-keycloak-realm:
    clients:
      budadmin-web:
        enabled: true
        protocol: openid-connect
        directAccessGrantsEnabled: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        publicClient: false
        serviceAccountsEnabled: false
        secret: budadmin-web
        attributes:
          post.logout.redirect.uris: https://admin.bud.lan
        protocolMappers:
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.client.audience: budadmin-web
            name: aud-budadmin-web
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
          # bud-atlas audiences: atlas authenticates against THIS realm (ADR-0114), so its two planes'
          # audiences are added here rather than atlas owning a realm. Admins read from AND ingest into
          # atlas via the admin surface, so budadmin-web tokens carry both. The audience is only a
          # "token accepted at atlas" gate — atlas does its own fine-grained authz (directory + SpiceDB).
          # A custom (non-client) audience uses included.custom.audience.
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.custom.audience: bud-atlas
            name: aud-bud-atlas
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.custom.audience: bud-atlas-ingest
            name: aud-bud-atlas-ingest
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
        redirectUris:
          - https://app.bud.lan/auth/redirect/callback
        webOrigins:
          - +
      budcustomer-web:
        attributes:
          post.logout.redirect.uris: https://admin.bud.lan##https://customer.bud.lan##https://playground.bud.lan
        directAccessGrantsEnabled: true
        enabled: true
        implicitFlowEnabled: false
        protocol: openid-connect
        protocolMappers:
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.client.audience: budcustomer-web
            name: aud-budcustomer-web
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
          # bud-atlas audiences (bud-atlas#982): this frontend's sessions reach atlas through the budapp
          # forward-auth (ADR-0156) like the admin console's. The audience is only a "token accepted at
          # atlas" gate — what a user sees and may change stays atlas's own authz (directory + SpiceDB,
          # connection roles, settings.* realm roles).
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.custom.audience: bud-atlas
            name: aud-bud-atlas
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.custom.audience: bud-atlas-ingest
            name: aud-bud-atlas-ingest
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
        publicClient: false
        redirectUris:
          - https://app.bud.lan/auth/redirect/callback
          # Customer-app root: allow-lists KEYCLOAK_CUSTOMER_ACTION_REDIRECT_URI so the
          # hosted invite/reset "set password" flow can redirect a CLIENT user back into
          # the customer portal on completion (else Keycloak rejects the redirect_uri).
          - https://customer.bud.lan/*
        secret: budcustomer-web
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        webOrigins:
          - +
      budplayground-web:
        attributes:
          post.logout.redirect.uris: https://playground.bud.lan
        directAccessGrantsEnabled: true
        enabled: true
        implicitFlowEnabled: false
        protocol: openid-connect
        protocolMappers:
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.client.audience: budplayground-web
            name: aud-budplayground-web
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
          # bud-atlas audiences (bud-atlas#982): this frontend's sessions reach atlas through the budapp
          # forward-auth (ADR-0156) like the admin console's. The audience is only a "token accepted at
          # atlas" gate — what a user sees and may change stays atlas's own authz (directory + SpiceDB,
          # connection roles, settings.* realm roles).
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.custom.audience: bud-atlas
            name: aud-bud-atlas
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.custom.audience: bud-atlas-ingest
            name: aud-bud-atlas-ingest
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
        publicClient: false
        redirectUris:
          - https://app.bud.lan/auth/redirect/callback
        secret: budplayground-web
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        webOrigins:
          - +
      mcp-gateway:
        attributes:
          post.logout.redirect.uris: https://admin.bud.lan##https://customer.bud.lan##https://playground.bud.lan
        directAccessGrantsEnabled: true
        enabled: true
        implicitFlowEnabled: false
        protocol: openid-connect
        protocolMappers:
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.client.audience: mcp-gateway
            name: aud-mcp-gateway
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
        publicClient: false
        redirectUris:
          - https://app.bud.lan/auth/redirect/callback
        secret: mcp-gateway
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        webOrigins:
          - +
      # budapp-admin: confidential service-account client for provisioning. secret is a dev placeholder — override via secrets.bud.yaml.
      budapp-admin:
        enabled: true
        protocol: openid-connect
        secret: budapp-admin
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        # budapp calls atlas (read; RAG/context) via this service account, so its tokens carry the
        # bud-atlas read audience. budprompt and budstudio will need the SAME mapper on their own
        # clients when they move off the static ATLAS_API_KEY / POC path to OAuth — no client exists
        # for either yet, so those are added when the clients are.
        protocolMappers:
          - config:
              access.token.claim: "true"
              id.token.claim: "false"
              included.custom.audience: bud-atlas
            name: aud-bud-atlas
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
    spec:
      enabled: true
      realm: bud-keycloak
      loginTheme: bud
      accountTheme: bud
      sslRequired: external
      accessTokenLifespan: 1800
      ssoSessionIdleTimeout: 604800
      ssoSessionMaxLifespan: 604800

      # Forgot-password + email login; self-registration off.
      loginWithEmailAllowed: true
      duplicateEmailsAllowed: false
      resetPasswordAllowed: true
      registrationAllowed: false

      # Realm SMTP is configured PER-ENV (needs real creds): dev -> values.bud.yaml + secrets.bud.yaml;
      # other envs add their own smtpServer to values.<env>.yaml + their secrets. Absent here so an
      # env without SMTP doesn't inherit a broken placeholder.

      roles:
        realm:
          # Atlas settings-plane roles (atlas_authn.roles). The atlas settings API authorizes on
          # these categories VERBATIM — not on super_admin/admin (no super-admin bypass by design).
          # Composed into the personas below so a budapp super_admin/admin token carries them and,
          # with the bud-atlas-ingest audience mapper on budadmin-web above, can drive the atlas
          # settings API directly — no separate grant, no separate login. Inert where atlas isn't
          # deployed. settings.tune = safe runtime knobs (model names, base URLs, retrieval knobs);
          # settings.admin = fingerprint-moving writes + every secret write; settings.scale =
          # replica/autoscaler bounds; any of them implies read. The categories do NOT nest —
          # settings.admin does not grant settings.tune — so configuring atlas takes both: tune for
          # model names/URLs/knobs, admin for API keys and the embedding model. Both admin personas
          # configure atlas in full; scaling the workers stays super_admin's alone.
          - name: settings.read
          - name: settings.tune
          - name: settings.admin
          - name: settings.scale
          - name: super_admin
            composite: true
            composites:
              realm:
                - settings.tune
                - settings.admin
                - settings.scale
          - name: admin
            composite: true
            composites:
              realm:
                - settings.tune
                - settings.admin
          - name: user

      users:
        - enabled: true
          username: root
          email: root@example.com
          emailVerified: true
          firstName: Root
          lastName: Admin
          realmRoles:
            - super_admin
            - default-roles-bud-keycloak
          credentials:
            - temporary: false
              type: password
              value: root@example.com

        # budapp-admin service-account role mapping (CRD has no serviceAccountClientRoles field, so it lives here).
        - enabled: true
          username: service-account-budapp-admin
          serviceAccountClientId: budapp-admin
          clientRoles:
            realm-management:
              - manage-users
              - view-users
