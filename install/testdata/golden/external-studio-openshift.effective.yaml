                        JWT_SECRET_KEY: golden-mcp-jwt
                        PLATFORM_ADMIN_EMAIL: admin@example.com
                        PLATFORM_ADMIN_PASSWORD: golden-admin-password
                rsaKeys:
                    privateKey: golden-rsa-private
                    privateKeyPassword: golden-rsa-password
                    publicKey: golden-rsa-public
            novu:
                externalDatabase:
                    password: golden-mongodb
                    username: bud_novu
                store:
                    encryption-key: golden-novu-encryption
            novuExtra:
                email: admin@example.com
                password: golden-novu-admin
            registries:
                registry.bud.studio:
                    password: registry-secret
                    username: robot
            storage:
                budmodelRegistry:
                    className: standard
                    size: 300Gi
    bud-studio:
