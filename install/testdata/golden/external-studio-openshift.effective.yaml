        namespace: bud-studio
        source:
            chart: budagent
            repoURL: registry.bud.studio/charts
            targetRevision: 0.3.6
        values:
            budGateway:
                enabled: true
                model: qwen3-8b
            externalDatabase:
                url: postgresql://bud:golden-postgres-bud@pooler-rw.postgres:5432/budagent
            externalKeycloak:
                baseUrl: https://auth.bud.example.com
                clientId: budadmin-web
                clientSecret: golden-keycloak-budadmin
                realm: bud-keycloak
            fullnameOverride: bud-studio
            ingress:
                annotations:
                    kubernetes.io/tls-acme: "true"
                className: openshift-default
                enabled: true
                host: studio.bud.example.com
                tlsSecretName: bud-studio-tls
            keycloak:
                clientBootstrap:
                    enabled: false
                enabled: false
            postgresql:
                enabled: false
            registries:
                registry.bud.studio:
                    password: registry-secret
                    username: robot
            web:
                enabled: true
    clickhouse:
        chartValueFiles:
            - example.minimal.yaml
        namespace: clickhouse
        source:
            chart: clickhouse
            repoURL: registry.bud.studio/charts
            targetRevision: 0.1.1
        values:
            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - preference:
                            matchExpressions:
                                - key: bud.studio/control-plane
                                  operator: In
                                  values:
                                    - "true"
                          weight: 75
            altinity-clickhouse-operator:
                affinity:
                    nodeAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                            - preference:
                                matchExpressions:
                                    - key: bud.studio/control-plane
                                      operator: In
                                      values:
                                        - "true"
                              weight: 75
            keeper:
                affinity:
                    nodeAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                            - preference:
                                matchExpressions:
                                    - key: bud.studio/control-plane
                                      operator: In
                                      values:
                                        - "true"
                              weight: 75
