                            password: golden-postgres-bud
                            username: bud
                        buddoc:
                            password: golden-postgres-bud
                            username: bud
                        budeval:
                            password: golden-postgres-bud
                            username: bud
                        budevent:
                            password: golden-postgres-bud
                            username: bud
                        budmetrics:
                            password: golden-postgres-bud
                            username: bud
                        budmodel:
                            password: golden-postgres-bud
                            username: bud
                        budpipeline:
                            password: golden-postgres-bud
                            username: bud
                        budprompt:
                            password: golden-postgres-bud
                            username: bud
                        budsim:
                            password: golden-postgres-bud
                            username: bud
                        keycloak:
                            password: golden-postgres-keycloak
                            username: keycloak
                        mcpgateway:
                            password: golden-postgres-bud
                            username: bud
                        onyx:
                            password: golden-postgres-bud
                            username: bud
