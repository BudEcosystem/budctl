                                clientId: budadmin-web
                                clientSecret: golden-keycloak-budadmin
                                hosts:
                                    - '{{ include "bud.ingress.hosts.budadmin" . }}'
                            budcustomer:
                                allowedReturnUrlOrigins:
                                    - '{{ include "bud.ingress.url.budcustomer" . }}'
                                clientId: budcustomer-web
                                clientSecret: golden-keycloak-budcustomer
                                hosts:
                                    - '{{ include "bud.ingress.hosts.budcustomer" . }}'
                            budplayground:
                                allowedReturnUrlOrigins:
