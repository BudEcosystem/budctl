applicationSet:
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata:
        name: production
        namespace: argocd
    spec:
        goTemplate: true
        goTemplateOptions:
            - missingkey=error
        template:
            metadata:
                annotations:
                    argocd.argoproj.io/compare-options: ServerSideDiff=true
                name: production-{{.name}}
            spec:
                destination:
                    namespace: '{{.namespace}}'
                    server: https://kubernetes.default.svc
                project: production
                syncPolicy:
                    automated:
                        enabled: false
                        selfHeal: true
                    syncOptions:
                        - CreateNamespace=true
                        - ServerSideApply=true
        templatePatch: |
            spec:
              sources:
                {{- if .gitPath }}
                - repoURL: {{ .gitRepoURL | quote }}
                  targetRevision: {{ .gitRevision | quote }}
                  path: {{ .gitPath | quote }}
                  helm:
                    releaseName: "{{.name}}"
                    valueFiles:
                      {{- .valueFiles | toYaml | nindent 12 }}
                {{- else }}
                - repoURL: {{ .repoURL | quote }}
                  chart: {{ .chart | quote }}
                  targetRevision: {{ .targetRevision | quote }}
                  helm:
                    releaseName: "{{.name}}"
                    valueFiles:
                      {{- .valueFiles | toYaml | nindent 12 }}
                {{- end }}
                - repoURL: "https://github.com/example/bud-config"
                  targetRevision: "main"
                  ref: values
argocdBootstrapValues:
    argo-cd:
        configs:
            cm:
                url: https://argocd.bud.example.com
            repositories:
                bud-charts:
                    enableOCI: "true"
                    name: bud-charts
                    password: registry-secret
                    type: helm
                    url: registry.bud.studio/charts
                    username: robot
    global:
        affinity:
            nodeAffinity:
                matchExpressions:
                    - key: bud.studio/control-plane
                      operator: In
                      values:
                        - "true"
                type: soft
        domain: argocd.bud.example.com
    ingress:
        className: openshift-default
        enabled: true
        host: argocd.bud.example.com
        isTraefik: false
    projects:
        production:
            clusterResourceWhitelist:
                - group: '*'
                  kind: '*'
            destinations:
                - namespace: '*'
                  server: https://kubernetes.default.svc
            sourceRepos:
                - '*'
    repo:
        enabled: true
        url: https://github.com/example/bud-config
    sopsAgeKeys: AGE-SECRET-KEY-19LCLPSGZL57K7TDN9CPH4H734VZN3JY0EAT60SG5W2QSK68F6A8QQPTQSL
