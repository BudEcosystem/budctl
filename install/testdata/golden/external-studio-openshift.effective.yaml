                                  operator: In
                                  values:
                                    - "true"
                          weight: 75
            psmdb-operator:
                affinity:
                    nodeAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                            - preference:
                                matchExpressions:
                                    - key: bud.studio/control-plane
                                      operator: In
                                      values:
                                        - "true"
                              weight: 75
            users:
                bud_novu:
                    db: bud_novu
                    password: golden-mongodb
                    roles:
                        - db: bud_novu
                          name: dbOwner
    opensandbox:
        chartValueFiles: []
        namespace: opensandbox-system
        source:
            gitPath: infra/charts/opensandbox
            gitRepoURL: https://github.com/BudEcosystem/bud-runtime.git
            gitRevision: adc5eb4518b820e3452512fcf30fe4cb2e1da524
        values:
            opensandbox:
                opensandbox-server:
                    server:
                        env:
                            - name: OPENSANDBOX_SERVER_API_KEY
                              value: golden-opensandbox-api
            registries:
                registry.bud.studio:
                    password: registry-secret
                    username: robot
    postgres:
        chartValueFiles:
            - example.minimal.yaml
        namespace: postgres
        source:
            chart: postgres
            repoURL: registry.bud.studio/charts
            targetRevision: 0.1.1
        values:
            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - preference:
                            matchExpressions:
                                - key: bud.studio/control-plane
                                  operator: In
                                  values:
                                    - "true"
                          weight: 75
            cloudnative-pg:
                affinity:
                    nodeAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                            - preference:
                                matchExpressions:
                                    - key: bud.studio/control-plane
                                      operator: In
                                      values:
                                        - "true"
                              weight: 75
            poolers:
                pooler-rw:
                    template:
                        spec:
                            affinity:
                                nodeAffinity:
                                    preferredDuringSchedulingIgnoredDuringExecution:
                                        - preference:
                                            matchExpressions:
                                                - key: bud.studio/control-plane
                                                  operator: In
                                                  values:
                                                    - "true"
                                          weight: 75
                pooler-rw-txn:
                    instances: 1
                    pgbouncer:
                        parameters:
                            log_connections: "0"
                            log_disconnections: "0"
                            max_client_conn: "1000"
                            server_idle_timeout: "120"
                        poolMode: transaction
                    template:
                        metadata:
                            labels:
                                app: pooler-txn
                        spec:
                            affinity:
                                nodeAffinity:
                                    preferredDuringSchedulingIgnoredDuringExecution:
                                        - preference:
                                            matchExpressions:
                                                - key: bud.studio/control-plane
                                                  operator: In
                                                  values:
                                                    - "true"
                                          weight: 75
                                podAntiAffinity:
                                    preferredDuringSchedulingIgnoredDuringExecution:
                                        - podAffinityTerm:
                                            labelSelector:
                                                matchLabels:
                                                    app: pooler-txn
                                            topologyKey: kubernetes.io/hostname
                                          weight: 100
                            containers: []
                    type: rw
            users:
                bud:
                    databases:
                        - budask
                        - budapp
                        - budcluster
                        - budmetrics
                        - budmodel
                        - budsim
                        - budeval
                        - budevent
                        - buddoc
                        - budprompt
                        - budcodeinterpreter
                        - mcpgateway
                        - budpipeline
                        - onyx
                        - budagent
                    password: golden-postgres-bud
                keycloak:
                    databases:
                        - keycloak
                    password: golden-postgres-keycloak
                seaweedfs:
                    databases:
                        - seaweedfs
                    password: golden-postgres-seaweedfs
    seaweedfs:
        chartValueFiles:
            - example.minimal.yaml
        namespace: seaweedfs
        source:
            chart: seaweedfs
            repoURL: registry.bud.studio/charts
            targetRevision: 0.1.1
        values:
            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - preference:
                            matchExpressions:
                                - key: bud.studio/control-plane
                                  operator: In
                                  values:
                                    - "true"
                          weight: 75
            buckets:
                bud-eval-artifacts:
                    anonymousRead: false
                    objectLock: false
                    quota:
                        enforce: true
                        size: 10Gi
                    reclaimPolicy: Delete
                    versioning: "Off"
                bud-model-info:
                    anonymousRead: false
                    objectLock: false
                    quota:
                        enforce: true
                        size: 1Gi
                    reclaimPolicy: Delete
                    versioning: "Off"
                bud-models-registry:
                    anonymousRead: false
                    objectLock: false
                    quota:
                        enforce: true
                        size: 300Gi
                    reclaimPolicy: Delete
                    versioning: "Off"
                bud-novu:
                    anonymousRead: false
                    objectLock: false
                    quota:
                        enforce: true
                        size: 1Gi
                    reclaimPolicy: Delete
                    versioning: "Off"
                bud-terraform-state:
                    anonymousRead: false
                    objectLock: false
                    quota:
                        enforce: true
                        size: 1Gi
                    reclaimPolicy: Retain
                    versioning: Enabled
            identity:
                bud:
                    accessKey: golden-s3-access
                    secretKey: golden-s3-secret
            ingress:
                className: openshift-default
                enabled: true
                host: s3.bud.example.com
                https: true
                isTraefik: false
            policy:
                bud:
                    identities:
                        - bud
                    statements:
                        - actions:
                            - s3:*
                          effect: Allow
                          resources:
                            - bud-novu
                            - bud-novu/*
                            - bud-model-info
                            - bud-model-info/*
                            - bud-models-registry
                            - bud-models-registry/*
                            - bud-eval-artifacts
                            - bud-eval-artifacts/*
                            - bud-terraform-state
