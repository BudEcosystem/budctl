                                - name: admin
                                - name: user
                        sslRequired: external
                        ssoSessionIdleTimeout: 604800
                        ssoSessionMaxLifespan: 604800
                        users:
                            - credentials:
                                - temporary: false
                                  type: password
                                  value: root@example.com
                              email: root@example.com
                              emailVerified: true
                              enabled: true
                              firstName: Root
                              lastName: Admin
                              realmRoles:
