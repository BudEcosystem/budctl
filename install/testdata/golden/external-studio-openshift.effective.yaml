            ingress:
                className: openshift-default
                enabled: true
                host: auth.bud.example.com
                https: true
                isTraefik: false
            password: golden-keycloak-admin
            postgres:
                password: golden-postgres-keycloak
            realms:
                keycloak-bud-keycloak-realm:
                    clients:
                        budadmin-web:
                            attributes:
                                post.logout.redirect.uris: https://admin.bud.example.com
                            directAccessGrantsEnabled: true
                            enabled: true
                            implicitFlowEnabled: false
                            protocol: openid-connect
                            protocolMappers:
                                - config:
                                    access.token.claim: "true"
                                    id.token.claim: "false"
                                    included.client.audience: budadmin-web
                                  name: aud-budadmin-web
                                  protocol: openid-connect
                                  protocolMapper: oidc-audience-mapper
                            publicClient: false
                            redirectUris:
                                - https://app.bud.example.com/auth/redirect/callback
                            secret: golden-keycloak-budadmin
                            serviceAccountsEnabled: false
                            standardFlowEnabled: true
                            webOrigins:
                                - +
                        budapp-admin:
                            directAccessGrantsEnabled: false
                            enabled: true
                            implicitFlowEnabled: false
                            protocol: openid-connect
                            publicClient: false
                            secret: golden-keycloak-budapp-admin
                            serviceAccountsEnabled: true
                            standardFlowEnabled: false
                        budcustomer-web:
                            attributes:
                                post.logout.redirect.uris: https://admin.bud.example.com##https://customer.bud.example.com##https://playground.bud.example.com
                            directAccessGrantsEnabled: true
                            enabled: true
                            implicitFlowEnabled: false
                            protocol: openid-connect
                            protocolMappers:
                                - config:
                                    access.token.claim: "true"
                                    id.token.claim: "false"
                                    included.client.audience: budcustomer-web
                                  name: aud-budcustomer-web
                                  protocol: openid-connect
                                  protocolMapper: oidc-audience-mapper
                            publicClient: false
                            redirectUris:
                                - https://app.bud.example.com/auth/redirect/callback
                                - https://customer.bud.example.com/*
                            secret: golden-keycloak-budcustomer
                            serviceAccountsEnabled: false
                            standardFlowEnabled: true
                            webOrigins:
                                - +
                        budplayground-web:
                            attributes:
                                post.logout.redirect.uris: https://playground.bud.example.com
                            directAccessGrantsEnabled: true
                            enabled: true
                            implicitFlowEnabled: false
                            protocol: openid-connect
                            protocolMappers:
                                - config:
                                    access.token.claim: "true"
                                    id.token.claim: "false"
                                    included.client.audience: budplayground-web
                                  name: aud-budplayground-web
                                  protocol: openid-connect
                                  protocolMapper: oidc-audience-mapper
                            publicClient: false
                            redirectUris:
                                - https://app.bud.example.com/auth/redirect/callback
                            secret: golden-keycloak-budplayground
                            serviceAccountsEnabled: false
                            standardFlowEnabled: true
                            webOrigins:
                                - +
                        mcp-gateway:
                            attributes:
                                post.logout.redirect.uris: https://admin.bud.example.com##https://customer.bud.example.com##https://playground.bud.example.com
                            directAccessGrantsEnabled: true
                            enabled: true
                            implicitFlowEnabled: false
                            protocol: openid-connect
                            protocolMappers:
                                - config:
                                    access.token.claim: "true"
                                    id.token.claim: "false"
                                    included.client.audience: mcp-gateway
                                  name: aud-mcp-gateway
                                  protocol: openid-connect
                                  protocolMapper: oidc-audience-mapper
                            publicClient: false
                            redirectUris:
                                - https://app.bud.example.com/auth/redirect/callback
                            secret: golden-keycloak-mcpgateway
                            serviceAccountsEnabled: false
                            standardFlowEnabled: true
                            webOrigins:
                                - +
                    spec:
                        accessTokenLifespan: 1800
                        duplicateEmailsAllowed: false
                        enabled: true
                        loginTheme: bud
                        loginWithEmailAllowed: true
                        realm: bud-keycloak
                        registrationAllowed: false
                        resetPasswordAllowed: true
                        roles:
