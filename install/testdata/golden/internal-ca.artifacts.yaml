values/seaweedfs/values.production.yaml:
    affinity:
        nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                        - key: bud.studio/control-plane
                          operator: In
                          values:
                            - "true"
                  weight: 75
    buckets:
        bud-eval-artifacts:
            anonymousRead: false
            objectLock: false
            quota:
                enforce: true
                size: 10Gi
            reclaimPolicy: Delete
            versioning: "Off"
        bud-model-info:
            anonymousRead: false
            objectLock: false
            quota:
                enforce: true
                size: 1Gi
            reclaimPolicy: Delete
            versioning: "Off"
        bud-models-registry:
            anonymousRead: false
            objectLock: false
            quota:
                enforce: true
                size: 300Gi
            reclaimPolicy: Delete
            versioning: "Off"
        bud-novu:
            anonymousRead: false
            objectLock: false
            quota:
                enforce: true
                size: 1Gi
            reclaimPolicy: Delete
            versioning: "Off"
        bud-terraform-state:
            anonymousRead: false
            objectLock: false
            quota:
                enforce: true
                size: 1Gi
            reclaimPolicy: Retain
            versioning: Enabled
    identity:
        bud:
            accessKey: bud
            secretKey: bud
    ingress:
        className: traefik
        enabled: true
        host: s3.bud.example.com
        https: true
        isTraefik: true
    policy:
        bud:
            identities:
                - bud
            statements:
                - actions:
                    - s3:*
                  effect: Allow
                  resources:
                    - bud-novu
                    - bud-novu/*
                    - bud-model-info
                    - bud-model-info/*
                    - bud-models-registry
                    - bud-models-registry/*
                    - bud-eval-artifacts
                    - bud-eval-artifacts/*
                    - bud-terraform-state
                    - bud-terraform-state/*
    seaweedfs-operator:
        affinity:
            nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                    - preference:
                        matchExpressions:
                            - key: bud.studio/control-plane
                              operator: In
                              values:
                                - "true"
                      weight: 75
        webhook:
            certManager:
                enabled: true
values/valkey/secrets.production.yaml:
