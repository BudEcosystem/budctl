apps/production.yaml:
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
        name: bootstrap
        namespace: argocd
    spec:
        destination:
            namespace: argocd
            server: https://kubernetes.default.svc
        project: default
        source:
            directory:
                include: production.yaml
            path: appsets
            repoURL: https://github.com/example/bud-config
            targetRevision: main
        syncPolicy:
            automated:
                enabled: false
                selfHeal: true
            syncOptions:
                - CreateNamespace=true
                - Prune=confirm
appsets/production.yaml:
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata:
        name: production
        namespace: argocd
    spec:
        generators:
            - list:
                elements:
                    - chart: argocd
                      gitPath: ""
                      name: argocd
                      namespace: argocd
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.1.1
                      valueFiles:
                        - $values/values/argocd/values.production.yaml
                        - $values/values/argocd/secrets.production.yaml
                    - chart: dapr
                      gitPath: ""
                      name: dapr
                      namespace: dapr-system
                      repoURL: https://dapr.github.io/helm-charts
                      targetRevision: 1.17.5
                      valueFiles:
                        - $values/values/dapr/values.production.yaml
                    - chart: kafka
                      gitPath: ""
                      name: kafka
                      namespace: kafka
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.1.1
                      valueFiles:
                        - example.minimal.yaml
                        - $values/values/kafka/values.production.yaml
                        - $values/values/kafka/secrets.production.yaml
                    - chart: mongodb
                      gitPath: ""
                      name: mongodb
                      namespace: mongodb
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.1.1
                      valueFiles:
                        - example.minimal.yaml
                        - $values/values/mongodb/values.production.yaml
                        - $values/values/mongodb/secrets.production.yaml
                    - chart: cert-manager
                      gitPath: ""
                      name: cert-manager
                      namespace: cert-manager
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.1.3
                      valueFiles:
                        - $values/values/cert-manager/values.production.yaml
                        - $values/values/cert-manager/secrets.production.yaml
                    - chart: kyverno
                      gitPath: ""
                      name: kyverno
                      namespace: kyverno
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.0.2
                      valueFiles:
                        - $values/values/kyverno/values.production.yaml
                    - chart: clickhouse
                      gitPath: ""
                      name: clickhouse
                      namespace: clickhouse
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.1.1
                      valueFiles:
                        - example.minimal.yaml
                        - $values/values/clickhouse/values.production.yaml
                        - $values/values/clickhouse/secrets.production.yaml
                    - chart: postgres
                      gitPath: ""
                      name: postgres
                      namespace: postgres
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.1.1
                      valueFiles:
                        - example.minimal.yaml
                        - $values/values/postgres/values.production.yaml
                        - $values/values/postgres/secrets.production.yaml
                    - chart: seaweedfs
                      gitPath: ""
                      name: seaweedfs
                      namespace: seaweedfs
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.1.1
                      valueFiles:
                        - example.minimal.yaml
                        - $values/values/seaweedfs/values.production.yaml
                        - $values/values/seaweedfs/secrets.production.yaml
                    - chart: valkey
                      gitPath: ""
                      name: valkey
                      namespace: valkey
                      repoURL: registry-1.docker.io/cloudpirates
                      targetRevision: 0.21.4
                      valueFiles:
                        - $values/values/valkey/values.production.yaml
                        - $values/values/valkey/secrets.production.yaml
                    - chart: keycloak
                      gitPath: ""
                      name: keycloak
                      namespace: keycloak
                      repoURL: registry.bud.studio/charts
                      targetRevision: 0.2.1
                      valueFiles:
                        - $values/values/keycloak/values.production.yaml
                        - $values/values/keycloak/secrets.production.yaml
                    - chart: bud
                      gitPath: ""
                      name: bud
                      namespace: bud
                      repoURL: registry.bud.studio/charts
                      targetRevision: 1.2.8
                      valueFiles:
                        - $values/values/bud/values.production.yaml
                        - $values/values/bud/secrets.production.yaml
                    - gitPath: infra/charts/opensandbox
                      gitRepoURL: https://github.com/BudEcosystem/bud-runtime.git
                      gitRevision: adc5eb4518b820e3452512fcf30fe4cb2e1da524
                      name: opensandbox
                      namespace: opensandbox-system
                      valueFiles:
                        - $values/values/opensandbox/secrets.production.yaml
        goTemplate: true
        goTemplateOptions:
            - missingkey=error
        template:
            metadata:
                annotations:
                    argocd.argoproj.io/compare-options: ServerSideDiff=true
                name: production-{{.name}}
            spec:
                destination:
                    namespace: '{{.namespace}}'
                    server: https://kubernetes.default.svc
                project: production
                syncPolicy:
                    automated:
                        enabled: false
                        selfHeal: true
                    syncOptions:
                        - CreateNamespace=true
                        - ServerSideApply=true
        templatePatch: |
            spec:
              sources:
                {{- if .gitPath }}
                - repoURL: {{ .gitRepoURL | quote }}
                  targetRevision: {{ .gitRevision | quote }}
                  path: {{ .gitPath | quote }}
                  helm:
                    releaseName: "{{.name}}"
                    valueFiles:
                      {{- .valueFiles | toYaml | nindent 12 }}
                {{- else }}
                - repoURL: {{ .repoURL | quote }}
                  chart: {{ .chart | quote }}
                  targetRevision: {{ .targetRevision | quote }}
                  helm:
                    releaseName: "{{.name}}"
                    valueFiles:
                      {{- .valueFiles | toYaml | nindent 12 }}
                {{- end }}
                - repoURL: "https://github.com/example/bud-config"
                  targetRevision: "main"
                  ref: values
