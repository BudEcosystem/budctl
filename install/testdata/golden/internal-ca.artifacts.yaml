values/cert-manager/values.production.yaml:
    bundles:
        ca-pemstore:
            sources:
                - useDefaultCAs: true
                - secret:
                    key: tls.crt
                    name: bud-internal-ca
            target:
                additionalFormats:
                    pkcs12:
                        key: cafebabe-ca.p12
                        password: ""
                configMap:
                    key: cafebabe-ca.pem
    cert-manager:
        affinity:
            nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                    - preference:
                        matchExpressions:
                            - key: bud.studio/control-plane
                              operator: In
                              values:
                                - "true"
                      weight: 75
        cainjector:
            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - preference:
                            matchExpressions:
                                - key: bud.studio/control-plane
                                  operator: In
                                  values:
                                    - "true"
                          weight: 75
        ingressShim:
            defaultIssuerName: bud-internal-ca
        startupapicheck:
            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - preference:
                            matchExpressions:
                                - key: bud.studio/control-plane
                                  operator: In
                                  values:
                                    - "true"
                          weight: 75
        webhook:
            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - preference:
                            matchExpressions:
                                - key: bud.studio/control-plane
                                  operator: In
                                  values:
                                    - "true"
                          weight: 75
    issuers:
        bud-internal-ca:
            ca:
                secretName: bud-internal-ca
    trust-manager:
        affinity:
            nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                    - preference:
                        matchExpressions:
                            - key: bud.studio/control-plane
                              operator: In
                              values:
                                - "true"
                      weight: 75
        enabled: true
