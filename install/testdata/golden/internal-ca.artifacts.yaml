values/keycloak/values.production.yaml:
    affinity:
        nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                        - key: bud.studio/control-plane
                          operator: In
                          values:
                            - "true"
                  weight: 75
    image: registry.bud.studio/runtime/keycloak-budtheme:0.2.2
    imagePullSecrets:
        - name: registry.bud.studio
    ingress:
        className: traefik
        enabled: true
        host: auth.bud.example.com
        https: true
        isTraefik: true
    realms:
        keycloak-bud-keycloak-realm:
            clients:
                budadmin-web:
                    attributes:
                        post.logout.redirect.uris: https://admin.bud.example.com
                    directAccessGrantsEnabled: true
                    enabled: true
                    implicitFlowEnabled: false
                    protocol: openid-connect
                    protocolMappers:
                        - config:
                            access.token.claim: "true"
                            id.token.claim: "false"
                            included.client.audience: budadmin-web
                          name: aud-budadmin-web
                          protocol: openid-connect
                          protocolMapper: oidc-audience-mapper
                    publicClient: false
                    redirectUris:
                        - https://app.bud.example.com/auth/redirect/callback
                    secret: budadmin-web
                    serviceAccountsEnabled: false
                    standardFlowEnabled: true
                    webOrigins:
                        - +
                budapp-admin:
                    directAccessGrantsEnabled: false
                    enabled: true
                    implicitFlowEnabled: false
                    protocol: openid-connect
                    publicClient: false
                    secret: budapp-admin
                    serviceAccountsEnabled: true
                    standardFlowEnabled: false
                budcustomer-web:
                    attributes:
                        post.logout.redirect.uris: https://admin.bud.example.com##https://customer.bud.example.com##https://playground.bud.example.com
                    directAccessGrantsEnabled: true
                    enabled: true
                    implicitFlowEnabled: false
                    protocol: openid-connect
                    protocolMappers:
                        - config:
                            access.token.claim: "true"
                            id.token.claim: "false"
                            included.client.audience: budcustomer-web
                          name: aud-budcustomer-web
                          protocol: openid-connect
                          protocolMapper: oidc-audience-mapper
                    publicClient: false
                    redirectUris:
                        - https://app.bud.example.com/auth/redirect/callback
                        - https://customer.bud.example.com/*
                    secret: budcustomer-web
                    serviceAccountsEnabled: false
                    standardFlowEnabled: true
                    webOrigins:
                        - +
                budplayground-web:
                    attributes:
                        post.logout.redirect.uris: https://playground.bud.example.com
                    directAccessGrantsEnabled: true
                    enabled: true
                    implicitFlowEnabled: false
                    protocol: openid-connect
                    protocolMappers:
                        - config:
                            access.token.claim: "true"
                            id.token.claim: "false"
                            included.client.audience: budplayground-web
                          name: aud-budplayground-web
                          protocol: openid-connect
                          protocolMapper: oidc-audience-mapper
                    publicClient: false
                    redirectUris:
                        - https://app.bud.example.com/auth/redirect/callback
                    secret: budplayground-web
                    serviceAccountsEnabled: false
                    standardFlowEnabled: true
                    webOrigins:
                        - +
                mcp-gateway:
                    attributes:
                        post.logout.redirect.uris: https://admin.bud.example.com##https://customer.bud.example.com##https://playground.bud.example.com
                    directAccessGrantsEnabled: true
                    enabled: true
                    implicitFlowEnabled: false
                    protocol: openid-connect
                    protocolMappers:
                        - config:
                            access.token.claim: "true"
                            id.token.claim: "false"
                            included.client.audience: mcp-gateway
                          name: aud-mcp-gateway
                          protocol: openid-connect
                          protocolMapper: oidc-audience-mapper
                    publicClient: false
                    redirectUris:
                        - https://app.bud.example.com/auth/redirect/callback
                    secret: mcp-gateway
                    serviceAccountsEnabled: false
                    standardFlowEnabled: true
                    webOrigins:
                        - +
            spec:
                accessTokenLifespan: 1800
                duplicateEmailsAllowed: false
                enabled: true
                loginTheme: bud
                loginWithEmailAllowed: true
                realm: bud-keycloak
                registrationAllowed: false
                resetPasswordAllowed: true
                roles:
                    realm:
                        - name: super_admin
                        - name: admin
                        - name: user
                sslRequired: external
                ssoSessionIdleTimeout: 604800
                ssoSessionMaxLifespan: 604800
                users:
                    - credentials:
                        - temporary: false
                          type: password
                          value: root@example.com
                      email: root@example.com
                      emailVerified: true
                      enabled: true
                      firstName: Root
                      lastName: Admin
                      realmRoles:
                        - super_admin
                      username: root
                    - clientRoles:
                        realm-management:
                            - manage-users
                            - view-users
                      enabled: true
                      serviceAccountClientId: budapp-admin
                      username: service-account-budapp-admin
values/kyverno/values.production.yaml:
    clusterPolicies:
        inject-ca:
            background: false
            rules:
                - match:
                    any:
                        - resources:
                            kinds:
                                - Pod
                  mutate:
                    foreach:
                        - list: request.object.spec.containers
                          patchStrategicMerge:
                            spec:
                                containers:
                                    - env:
                                        - name: SSL_CERT_FILE
                                          value: /etc/ssl/certs/cafebabe-ca.pem
                                        - name: NODE_EXTRA_CA_CERTS
                                          value: /etc/ssl/certs/cafebabe-ca.pem
                                        - name: REQUESTS_CA_BUNDLE
