values/bud/values.production.yaml:
    externalServices:
        oidc:
            url: https://auth.bud.example.com/realms/bud-keycloak
        s3:
            endpoint: s3.bud.example.com
            secure: true
    global:
        ingress:
            hosts:
                root: bud.example.com
    ingress:
        className: traefik
        https: internal
        isTraefik: true
    microservices:
        budapp:
            redirectFlow:
                clientsByHost:
                    budadmin:
                        allowedReturnUrlOrigins:
                            - '{{ include "bud.ingress.url.budadmin" . }}'
                        hosts:
                            - '{{ include "bud.ingress.hosts.budadmin" . }}'
                    budcustomer:
                        allowedReturnUrlOrigins:
                            - '{{ include "bud.ingress.url.budcustomer" . }}'
                        hosts:
                            - '{{ include "bud.ingress.hosts.budcustomer" . }}'
                    budplayground:
                        allowedReturnUrlOrigins:
                            - '{{ include "bud.ingress.url.budplayground" . }}'
                        hosts:
                            - '{{ include "bud.ingress.hosts.budplayground" . }}'
        budcodeinterpreter:
            enabled: true
        budeval:
            enabled: true
    prometheus:
        server:
            securityContext:
                fsGroup: 65534
                runAsGroup: 65534
                runAsUser: 65534
    storage:
        budmodelRegistry:
            className: standard
            size: 300Gi
