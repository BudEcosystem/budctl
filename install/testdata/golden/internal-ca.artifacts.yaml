values/valkey/values.production.yaml:
    affinity:
        nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                        - key: bud.studio/control-plane
                          operator: In
                          values:
                            - "true"
                  weight: 75
        podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - podAffinityTerm:
                    labelSelector:
                        matchLabels:
                            app.kubernetes.io/name: valkey
                    topologyKey: kubernetes.io/hostname
                  weight: 100
    architecture: replication
    auth:
        enabled: true
        password: valkey
    config:
        extraConfig:
            - notify-keyspace-events KEA
    enabled: true
    metrics:
        enabled: false
    persistence:
        enabled: true
        size: 1Gi
    replicaCount: 1
    resources:
        limits:
            memory: 1Gi
    sentinel:
        enabled: false
