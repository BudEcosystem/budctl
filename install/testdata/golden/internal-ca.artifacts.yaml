values/postgres/values.production.yaml:
    affinity:
        nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                        - key: bud.studio/control-plane
                          operator: In
                          values:
                            - "true"
                  weight: 75
    cloudnative-pg:
        affinity:
            nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
