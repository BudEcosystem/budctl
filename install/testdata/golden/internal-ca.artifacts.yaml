        configs:
            cm:
                url: https://argocd.bud.example.com
        redis:
            securityContext:
                runAsUser: 999
    global:
        affinity:
            nodeAffinity:
                matchExpressions:
                    - key: bud.studio/control-plane
                      operator: In
                      values:
                        - "true"
